<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz do escritório</title>
<!-- Protótipo estático (26/10/2026), direção B aprovada; A e C rejeitadas e removidas. Central · Tomadas aprovada. Tokens e componentes: src/MeuClima/Web/app.css; fontes: fonts.css. -->
<link rel="stylesheet" href="../../../src/MeuClima/Web/fonts.css">
<link rel="stylesheet" href="../../../src/MeuClima/Web/app.css">
<style>
  body{background:var(--desk);padding:20px 16px 40px}
  .bar-top{max-width:1240px;margin:0 auto 18px;display:grid;gap:10px}
  .bar-top h1{font:600 1.15rem var(--display);margin:0}
  .bar-top p{margin:0;color:var(--ink-2);font-size:.86rem;max-width:880px}
  .ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .ctl .seg{background:var(--panel)}
  .stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
  .stage.wide{grid-template-columns:minmax(0,1fr)}
  @media (max-width:820px){.stage{grid-template-columns:1fr}}
  .notes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;font-size:.86rem;color:var(--ink-2)}
  .notes h2{font:600 1rem var(--display);color:var(--ink);margin:0}
  .notes ul{margin:0;padding-left:1.1rem;display:grid;gap:5px}
  .notes b{color:var(--ink)}

  /* moldura do flyout, igual ao app */
  .fly{width:380px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
  .whead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line);gap:10px}
  .whead .ttl{display:grid}
  .whead b{font:600 .98rem var(--display)}
  .whead .mono{font-size:.68rem;color:var(--ink-3)}
  .whead .acts{display:flex;gap:6px;align-items:center}
  .view{padding:16px;display:flex;flex-direction:column;gap:14px}
  .foot{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel-2)}
  .who .k{font:600 .78rem var(--display);display:block}
  .who .d{color:var(--ink-2);font:400 .72rem var(--mono);line-height:1.5;display:block}
  .who.idle{border-left-color:var(--off)}
  .dot.lamp{background:#e2b23a;box-shadow:0 0 0 3px color-mix(in srgb,#e2b23a 28%,transparent)}
  .pwr.lamp[aria-pressed="true"]{background:#d4a12a}
  .sec-l{font:500 .66rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 -6px}

  /* B: faixa da luz */
  .lampbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2)}
  .lampbar.on{border-color:#d4a12a;background:color-mix(in srgb,#e2b23a 14%,var(--panel))}
  .lampbar .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
  .lampbar.on .ic{background:#e2b23a;border-color:#d4a12a;color:#3a2a05}
  .lampbar .ic svg{width:18px;height:18px}
  .lampbar b{font:600 .9rem var(--display);display:block}
  .lampbar .d{font:400 .72rem var(--mono);color:var(--ink-2)}
  .lampbar .sub{grid-column:1/-1;font:400 .72rem var(--mono);color:var(--ink-2);border-top:1px dashed var(--line);padding-top:7px;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
  .plugs{display:flex;gap:6px;flex-wrap:wrap}
  .plug{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;background:var(--panel);font:500 .76rem var(--body);color:var(--ink-2)}
  .plug .dot{width:7px;height:7px}
  .plug.off{opacity:.55}


  /* central */
  .central{max-width:1040px;width:100%;margin:0 auto;display:grid;grid-template-columns:212px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-height:620px}
  .side{background:var(--panel-2);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:3px}
  .side .brand{font:600 1.02rem var(--display);padding:2px 10px 14px}
  .side button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink-2);font:500 .88rem var(--body)}
  .side button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .side .new{font:500 .58rem var(--mono);color:var(--cool);border:1px solid var(--cool);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
  .main{padding:22px 26px 40px;display:grid;gap:16px;align-content:start;min-width:0}
  .main h2{font:600 1.2rem var(--display);margin:0}
  .main h3.sec{font:500 .7rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 -6px}
  .twocol{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
  @media (max-width:900px){.twocol{grid-template-columns:1fr}.central{grid-template-columns:1fr}.side{display:none}}
  .devrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .devrow:last-child{border-bottom:0}
  .devrow b{font:600 .88rem var(--display)}
  .devrow .m{grid-column:2/-1;font:400 .7rem var(--mono);color:var(--ink-2)}
  .kbd{font:500 .74rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel-2)}
</style>
</head>
<body>
<div class="bar-top">
  <h1>Luz do escritório no Meu Clima</h1>
  <p>Protótipo estático com dados fictícios. Escolha a tela, a direção da bandeja e a situação; o painel ao
    lado diz o que cada direção resolve. Botões de aparelho só ligam e desligam aqui, sem efeito real.</p>
  <div class="ctl">
    <div class="seg inline" role="group" aria-label="Tela" id="tela"></div>
    <div class="seg inline" role="group" aria-label="Direção" id="dir"></div>
    <div class="seg inline" role="group" aria-label="Tema" id="theme"></div>
  </div>
  <div class="ctl"><div class="seg inline" role="group" aria-label="Situação" id="cen" style="flex-wrap:wrap"></div></div>
</div>

<div class="stage" id="stage">
  <div id="fly"></div>
  <div class="notes" id="notes"></div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const BULB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';

  // Mesmo dado nas três direções. Nomes, horários e IPs fictícios.
  const AC = { name: 'Escritório', on: true, mode: 'Frio', fan: 'Auto', target: 24, amb: 25,
    ctrl: { kind: 'rule', who: 'Conforto', detail: 'frio econômico em 24 °C · faixa 23–24 °C' } };
  const CEN = {
    uso: { label: 'Usando o PC, luz acesa', lamp: { on: true, kind: 'watch', who: 'Ao bloquear o PC, apago',
      detail: 'acesa desde 08:12 · você ligou pelo PC' }, ac: AC },
    apagou: { label: 'Voltou e a luz foi apagada', lamp: { on: false, kind: 'rule', who: 'Apaguei quando você bloqueou',
      detail: '12:31 → 13:05 · lá fora está claro, não religuei', action: 'Acender' }, ac: { ...AC, on: true } },
    religou: { label: 'Voltou à noite', lamp: { on: true, kind: 'rule', who: 'Religuei ao desbloquear',
      detail: 'apaguei às 18:02 · voltou 18:20 · já escureceu', action: 'Desfazer' }, ac: AC },
    manual: { label: 'Alguém acendeu no interruptor', lamp: { on: true, kind: 'manual', who: 'Acesa no interruptor da parede',
      detail: 'com o PC bloqueado, às 19:10 · não apago de novo até você voltar' }, ac: { ...AC, on: false,
      ctrl: { kind: 'none', who: 'Ninguém no PC', detail: 'Conforto só age com alguém no PC' } } },
    sem: { label: 'Sem conexão local', lamp: { on: null, kind: 'block', who: 'Não acho a luz na rede',
      detail: 'VPN ativa pode estar bloqueando a rede local · uso a nuvem eWeLink', action: 'Diagnóstico' }, ac: AC },
  };
  const PLUGS = [{ n: 'Quarto', on: false }, { n: 'Tomada externa', on: false, offline: true }];

  const S = { tela: 'bandeja', dir: 'B', cen: 'uso', theme: 'system' };
  const lampMeta = l => l.on === null ? 'sem resposta · 1 tentativa' : l.on ? 'acesa · consumo estimado 9 W' : 'apagada';

  const wx = () => `<div class="wx">
    <div><span class="lbl">Fora</span><span class="v tnum">${S.cen === 'religou' ? '22 °C' : '29 °C'}</span><span class="s tnum">${S.cen === 'religou' ? 'pôr do sol 18:04' : 'sente 31° · 48%'}</span></div>
    <div><span class="lbl">Escritório</span><span class="v tnum">25 °C</span><span class="s">cômodo do PC</span></div>
    <div><span class="lbl">Pico hoje</span><span class="v tnum">32 °C</span><span class="s">às 15h · sente 34°</span></div></div>`;
  const head = () => `<div class="whead"><div class="ttl"><b>Meu Clima</b><span class="mono tnum">atualizado 14:12</span></div>
    <div class="acts"><button class="btn">Abrir central</button><button class="ib" aria-label="Mais opções">⋯</button></div></div>`;
  const foot = () => `<div class="foot"><span class="mono small muted">clima de 14:00 · Open-Meteo</span><span class="mono small muted">luz <span class="kbd">Ctrl+Alt+L</span></span></div>`;
  const who = c => `<div class="who ${c.kind}"><div><span class="k">${esc(c.who)}</span><span class="d">${esc(c.detail)}</span></div>
    ${c.action ? `<button class="link">${esc(c.action)}</button>` : '<span></span>'}</div>`;
  const acMeta = d => d.on ? `${d.mode.toLowerCase()} · ${d.fan.toLowerCase()} · amb&nbsp;${d.amb}&nbsp;°C` : `desligado · amb&nbsp;${d.amb}&nbsp;°C`;
  const acDev = d => `<div class="dev"><span class="dot ${d.on ? 'on' : ''}"></span>
    <div style="min-width:0"><div class="n">${esc(d.name)} · ar</div><div class="m tnum">${acMeta(d)}</div></div>
    <div class="t"><button class="ib" aria-label="Diminuir">−</button><span class="v tnum${d.on ? '' : ' off'}">${d.target}</span><button class="ib" aria-label="Aumentar">+</button><button class="pwr" data-ac aria-pressed="${d.on}" aria-label="Ligar o ar"></button></div>
    ${who(d.ctrl)}</div>`;
  const lampSwitch = l => `<button class="pwr lamp" data-lamp aria-pressed="${!!l.on}" aria-label="Acender a luz" ${l.on === null ? 'disabled' : ''}></button>`;


  function renderB(c) {
    const l = c.lamp;
    const lamp = `<div class="lampbar${l.on ? ' on' : ''}"><span class="ic">${BULB}</span>
      <div style="min-width:0"><b>Luz do escritório</b><span class="d">${lampMeta(l)}</span></div>${lampSwitch(l)}
      <div class="sub"><span>${esc(l.who)} · ${esc(l.detail)}</span>${l.action ? `<button class="link">${esc(l.action)}</button>` : ''}</div></div>`;
    const plugs = `<div class="plugs">${PLUGS.map(p => `<span class="plug${p.offline ? ' off' : ''}"><span class="dot"></span>${esc(p.n)}${p.offline ? ' · offline' : ''}</span>`).join('')}</div>`;
    return `<div class="fly">${head()}<div class="view">${wx()}${lamp}${plugs}<div>${acDev(c.ac)}</div></div>${foot()}</div>`;
  }


  const DIR = {
    B: { label: 'B · Faixa da luz no topo', render: renderB, notes: `
      <h2>B · Faixa própria da luz, logo abaixo do clima</h2>
      <ul>
        <li>A luz vira o controle mais à mão: um clique, alvo grande, acesa aparece em amarelo.</li>
        <li>Abaixo dela, uma linha com o que o app fez ou vai fazer, e a ação para desfazer.</li>
        <li>Outras tomadas viram pílulas compactas; clique abre a central.</li>
        <li><b>Contra:</b> separa luz e ar visualmente; a ligação "bloqueou → apaga os dois" fica implícita.</li>
      </ul>` },
  };

  function central() {
    const lampRow = (n, m, on, off) => `<div class="devrow"><span class="dot ${on ? 'lamp' : ''}"></span><b>${n}</b>
      <span class="chip ${off ? 'warn' : 'ok'}">${off ? 'offline' : 'rede local'}</span><span class="m tnum">${m}</span></div>`;
    return `<div class="central"><nav class="side"><div class="brand">Meu Clima</div>
      <button>Aparelhos</button><button>Regras</button><button>Insights</button>
      <button aria-current="page">Tomadas<span class="new">novo</span></button><button>Ajustes</button></nav>
      <main class="main"><div><h2>Tomadas</h2><p class="muted small" style="margin:4px 0 0">Interruptores e tomadas Sonoff (eWeLink), comandados pela rede local.</p></div>
      <div class="twocol"><div style="display:grid;gap:12px">
        <h3 class="sec">Luz do escritório</h3>
        <div class="card">
          <div class="fld"><span class="lb">Aparelho</span><select class="inp"><option>Escritório (TX1C)</option><option>Quarto (TX1C)</option></select></div>
          <div class="fld"><span class="lb">Ao bloquear ou suspender o PC, apagar</span><button class="pwr lamp" aria-pressed="true"></button>
            <span class="hint">Só apaga se estiver acesa. Se alguém acender no interruptor com o PC bloqueado, não apaga de novo.</span></div>
          <div class="fld"><span class="lb">Esperar antes de apagar</span><span class="unit"><input class="inp num" value="0"><em>seg</em></span>
            <span class="hint">0 apaga na hora. Um valor maior evita apagar num bloqueio rápido.</span></div>
          <div class="fld"><span class="lb">Ao desligar o PC, apagar</span><button class="pwr lamp" aria-pressed="true"></button>
            <span class="hint">O Windows dá ~4 s; pela rede local o comando leva ~0,1 s.</span></div>
          <div class="fld"><span class="lb">Ao desbloquear, reacender</span><div class="seg inline"><button>Nunca</button><button aria-pressed="true">Se escuro</button><button>Sempre</button></div>
            <span class="hint">Só reacende o que o app apagou. "Escuro" usa o pôr do sol do Open-Meteo da sua cidade.</span></div>
          <div class="fld"><span class="lb">Atalho para acender e apagar</span><span class="kbd">Ctrl+Alt+L</span></div>
        </div>
        <h3 class="sec">Aparelhos da conta</h3>
        <div class="card" style="gap:0">${lampRow('Escritório', 'TX1C · 192.168.0.42 · visto agora', true)}${lampRow('Quarto', 'TX1C · 192.168.0.37 · visto agora', false)}${lampRow('Tomada externa', 'BASICR2 · sem anúncio na rede há 3 dias', false, true)}</div>
      </div>
      <div style="display:grid;gap:12px">
        <div class="card"><h3>Conta eWeLink</h3><span class="chip ok" style="justify-self:start">conectada</span>
          <span class="small muted">As chaves dos aparelhos ficam cifradas neste PC. A nuvem só é usada para buscar as chaves e quando a rede local falha.</span>
          <div class="actions" style="display:flex;gap:8px"><button class="btn">Sincronizar aparelhos</button><button class="btn danger">Desconectar</button></div></div>
        <div class="card"><h3>Hoje</h3>
          <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><span class="lbl">Acesa</span><span class="v tnum">6 h 40</span><span class="s">desde 08:12</span></div>
          <div class="kpi"><span class="lbl">Apaguei</span><span class="v tnum">3×</span><span class="s">2 h 05 economizadas</span></div></div></div>
      </div></div></main></div>`;
  }

  function seg(el, opts, cur, key) {
    $(el).innerHTML = opts.map(([v, t]) => `<button data-${key}="${v}" aria-pressed="${v === cur}">${esc(t)}</button>`).join('');
  }
  function render() {
    seg('tela', [['bandeja', 'Bandeja'], ['central', 'Central · Tomadas']], S.tela, 'tela');
    seg('dir', Object.entries(DIR).map(([k, d]) => [k, d.label]), S.dir, 'dir');
    seg('cen', Object.entries(CEN).map(([k, c]) => [k, c.label]), S.cen, 'cen');
    seg('theme', [['system', 'Sistema'], ['light', 'Claro'], ['dark', 'Escuro']], S.theme, 'theme');
    $('dir').hidden = $('cen').hidden = S.tela !== 'bandeja';
    $('stage').classList.toggle('wide', S.tela !== 'bandeja');
    $('notes').hidden = S.tela !== 'bandeja';
    if (S.tela === 'central') { $('fly').innerHTML = central(); return; }
    $('fly').innerHTML = DIR[S.dir].render(CEN[S.cen]);
    $('notes').innerHTML = DIR[S.dir].notes + `<h2>Em todas as direções</h2><ul>
      <li>Atalho global <b>Ctrl+Alt+L</b> e item "Acender/apagar a luz" no menu da bandeja: liga sem abrir nada.</li>
      <li>A linha de status sempre diz quem fez o quê e quando, com a ação para desfazer.</li>
      <li>Situação "Sem conexão local" cobre a VPN ligada nesta máquina.</li></ul>`;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const c = CEN[S.cen];
    if (b.dataset.tela) S.tela = b.dataset.tela;
    else if (b.dataset.dir) S.dir = b.dataset.dir;
    else if (b.dataset.cen) S.cen = b.dataset.cen;
    else if (b.dataset.theme) { S.theme = b.dataset.theme; if (S.theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = S.theme; }
    else if ('lamp' in b.dataset) c.lamp = { ...c.lamp, on: !c.lamp.on, kind: 'manual', who: 'Você', detail: `${c.lamp.on ? 'apagou' : 'acendeu'} pelo PC às 14:12`, action: null };
    else if ('ac' in b.dataset) c.ac = { ...c.ac, on: !c.ac.on };
    else if ('scene' in b.dataset) { const on = !(c.ac.on || c.lamp.on); c.ac = { ...c.ac, on }; c.lamp = { ...c.lamp, on, kind: 'manual', who: 'Você', detail: on ? 'chegou às 14:12' : 'saiu às 14:12', action: null }; }
    else if (b.parentElement?.classList.contains('seg')) { [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
    else return;
    render();
  });
  render();
})();
</script>
</body>
</html>
